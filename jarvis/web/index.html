<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#05080d">
<title>Jarvis</title>
<style>
  :root {
    --bg: #05080d; --panel: #0b121b; --text: #d8e6f2; --muted: #6f8597;
    --accent: #4cc9f0; --accent-2: #f72585; --ok: #80ed99; --line: #16222f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 6px; }
  header h1 { font-size: 15px; letter-spacing: .35em; font-weight: 600; margin: 0; color: var(--accent); }
  header button { background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 6px 10px; font-size: 13px; white-space: nowrap; }
  header { gap: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; gap: 10px;
    mask-image: linear-gradient(to bottom, transparent, #000 24px); }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .you { align-self: flex-end; background: #13314a; border-bottom-right-radius: 6px; }
  .jarvis { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }
  .msg a { color: var(--accent); }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 0 10px; }
  #orb { width: 132px; height: 132px; border-radius: 50%; border: none; cursor: pointer; position: relative;
    background: radial-gradient(circle at 50% 45%, #e9fbff 0 8%, var(--accent) 22%, #0c5a7a 55%, #061b26 72%);
    box-shadow: 0 0 calc(30px + var(--level, 0) * 90px) rgba(76, 201, 240, .55);
    transform: scale(calc(1 + var(--level, 0) * .18)); transition: transform .08s, box-shadow .08s, filter .3s; }
  #orb::after { content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 2px solid rgba(76, 201, 240, .35); }
  body[data-state="idle"] #orb { filter: saturate(.35) brightness(.75); }
  body[data-state="standby"] #orb { filter: saturate(.25) brightness(.5); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { filter: saturate(.4) brightness(.7); } }
  body[data-state="standby"] #status { color: var(--accent); opacity: .55; }
  body[data-state="thinking"] #orb::after { border-color: transparent; border-top-color: var(--accent);
    animation: spin .9s linear infinite; }
  body[data-state="speaking"] #orb { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { box-shadow: 0 0 80px rgba(76, 201, 240, .8); } }
  #status { color: var(--muted); font-size: 14px; min-height: 20px; text-align: center; }
  form { display: flex; gap: 8px; padding-bottom: 12px; }
  input[type=text] { flex: 1; min-width: 0; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px; padding: 12px 16px; font-size: 16px; outline: none; }
  form button { background: var(--accent); color: #00141d; border: none; border-radius: 999px;
    padding: 0 18px; font-weight: 600; font-size: 15px; }
  #setup { display: none; flex: 1; flex-direction: column; justify-content: center; gap: 12px; text-align: center; }
  body.needs-token #setup { display: flex; }
  #handoff { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 1.3rem; line-height: 1.6; background: rgba(0,0,0,.82); color: #fff; }
  #handoff b { font-size: 2rem; }
  body.needs-token #log, body.needs-token #stage, body.needs-token #chat { display: none; }
  [hidden] { display: none !important; }
  /* ---- voice mode (default): just Jarvis, no text; the transcript is one tap away ---- */
  body.voice #log, body.voice #chat { display: none; }
  body.voice #stage { flex: 1; justify-content: center; gap: 28px; }
  body.voice #orb { width: 220px; height: 220px; }
  body.voice #status { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
  #linkChip { display: none; }
  body.voice #linkChip:not([hidden]) { display: inline-block; }
  /* ---- views & tabs ---- */
  .tabs { display: flex; gap: 5px; }
  .tabs button.active { color: var(--text); border-color: var(--accent); }
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .view[hidden] { display: none; }
  body.needs-token .view { display: none; }
  /* ---- dashboard ---- */
  #dashView { overflow-y: auto; gap: 14px; padding: 8px 0 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .card h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 10px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .label { color: var(--muted); font-size: 13px; min-width: 96px; }
  .seg button, .small { background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .seg button.on { color: #00141d; background: var(--accent); border-color: var(--accent); }
  .mono { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
    word-break: break-word; color: var(--muted); margin: 0; }
  .job { border-top: 1px solid var(--line); padding: 12px 0 4px; }
  .job:first-of-type { border-top: none; }
  .job .head { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .pill { border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
  .pill.running { background: rgba(76,201,240,.18); color: var(--accent); }
  .pill.queued { background: rgba(255,255,255,.08); }
  .pill.done { background: rgba(128,237,153,.15); color: var(--ok); }
  .pill.failed, .pill.cancelled { background: rgba(247,37,133,.15); color: var(--accent-2); }
  .job .task { margin: 6px 0; overflow-wrap: anywhere; }
  .job .result { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
  .job .act pre { max-height: 220px; overflow-y: auto; }
  .job details summary { color: var(--muted); font-size: 13px; cursor: pointer; }
  .inline { display: flex; gap: 6px; margin-top: 6px; }
  .inline input, .card textarea { flex: 1; min-width: 0; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; }
  .card textarea { width: 100%; min-height: 64px; resize: vertical; }
  a.small { display: inline-block; text-decoration: none; margin: 4px 0; }
  a.primary { display: inline-block; text-decoration: none; margin: 4px 0; }
  .primary { background: var(--accent); color: #00141d; border: none; border-radius: 999px;
    padding: 8px 16px; font-weight: 600; font-size: 14px; }
  .list { margin: 0; padding: 0; list-style: none; }
  .list li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; overflow-wrap: anywhere;
    border-top: 1px solid var(--line); font-size: 14px; }
  .list li:first-child { border-top: none; }
  .empty { color: var(--muted); font-size: 14px; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--accent); padding: 10px 16px; border-radius: 12px;
    max-width: 90vw; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body data-state="idle">
<header>
  <h1>JARVIS</h1>
  <div class="tabs">
    <button id="tabTalk" type="button" class="active">Talk</button>
    <button id="tabDash" type="button">Dashboard</button>
    <button id="textToggle" type="button">Text</button>
    <button id="reset" type="button" aria-label="New chat">New</button>
  </div>
</header>

<section id="setup">
  <p>Open this page using the link Jarvis printed on your laptop<br>(it ends in <code>?token=…</code>).</p>
  <form id="tokenForm"><input id="tokenInput" type="text" placeholder="…or paste the token here"><button>Save</button></form>
</section>

<main id="talkView" class="view">
<div id="log"></div>

<div id="stage">
  <button id="orb" aria-label="Talk to Jarvis"></button>
  <div id="status">Tap to talk</div>
  <a id="linkChip" class="small" target="_blank" hidden></a>
</div>

<form id="chat" autocomplete="off">
  <input id="text" type="text" placeholder="Or type to Jarvis…" enterkeyhint="send">
  <button>Send</button>
</form>
</main>

<main id="dashView" class="view" hidden>
  <section class="card">
    <h2>Coding <span id="jobCount" class="empty"></span></h2>
    <textarea id="jobTask" placeholder="What should Claude Code build or fix? e.g. Build a workout tracker web app"></textarea>
    <div class="row"><button id="jobStart" class="primary" type="button">Start job</button></div>
    <div id="jobs"></div>
  </section>

  <section class="card">
    <h2>Controls</h2>
    <div class="row"><span class="label">Notifications</span>
      <span class="seg" id="segMode">
        <button data-v="normal">Normal</button><button data-v="quiet">Quiet</button><button data-v="hold">Hold</button>
      </span>
      <button class="small" id="wakeBtn" data-v="wake" hidden>☀️ Good morning</button>
    </div>
    <div class="row"><span class="label">Claude Code done</span>
      <span class="seg" id="segWatch">
        <button data-v="off">Off</button><button data-v="once">Next time</button><button data-v="always">Always</button>
      </span>
    </div>
    <div class="row"><span class="label">Version</span><button class="small" id="updateBtn" type="button">Check for updates</button></div>
  </section>

  <section class="card">
    <h2>Held for you <button class="small" id="clearHeld" type="button">Clear</button></h2>
    <ul class="list" id="held"></ul>
  </section>

  <section class="card">
    <h2>Status</h2>
    <pre class="mono" id="statusText"></pre>
  </section>

  <section class="card">
    <h2>Usage &amp; speed</h2>
    <pre class="mono" id="statsText"></pre>
  </section>

  <section class="card">
    <h2>What Jarvis remembers</h2>
    <ul class="list" id="memory"></ul>
  </section>
</main>
<div id="toast"></div>

<audio id="player" playsinline></audio>

<script>
(() => {
  // ---------- setup ----------
  const $ = (id) => document.getElementById(id);
  const log = $("log"), orb = $("orb"), statusEl = $("status"), player = $("player");
  const params = new URLSearchParams(location.search);
  const handoff = params.get("talk") === "1";   // opened by Siri ("switch to the app")
  if (handoff && !params.get("token")) history.replaceState(null, "", location.pathname);
  let token = params.get("token") || safeGet("jarvis-token");
  if (params.get("token")) { safeSet("jarvis-token", token); history.replaceState(null, "", location.pathname); }
  if (!token) document.body.classList.add("needs-token");
  $("tokenForm").onsubmit = (e) => { e.preventDefault(); const t = $("tokenInput").value.trim();
    if (t) { safeSet("jarvis-token", t); location.reload(); } };

  function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

  // "I'm done", "goodbye", "stop listening"... only as the whole thing you said, never a "bye"
  // at the end of a normal sentence. Puts Jarvis on standby without asking the server anything.
  const GOODBYE = /^(ok(ay)?|alright|all right|thanks?( you)?|thank you|cool|great|perfect|no|so)?([,.! ]*jarvis)?[,.! ]*(bye|bye[- ]bye|by|buy|good ?-?bye|good ?night|see (ya|you)( later)?|talk (to you )?later|that'?s (all|it)|that will be all|i'?m (done|good|all set|finished)|i am (done|finished)|we'?re (done|good)|done (talking|for now)|nothing( else)?|no thanks?|stop listening|go to sleep|(go (to |on )?)?standby|sleep|dismissed|over and out)( for now| jarvis| thanks?| thank you| sir| then)*[.!?]*$/i;
  // Same rule as the server: the whole utterance, or the last sentence after a short acknowledgement.
  function isStandby(text) {
    text = (text || "").trim();
    if (GOODBYE.test(text)) return true;
    const parts = text.split(/[.!?,;]+\s*/).map(p => p.trim()).filter(Boolean);
    if (parts.length < 2 || !GOODBYE.test(parts[parts.length - 1])) return false;
    return parts.slice(0, -1).join(" ").split(/\s+/).length <= 6;
  }
  let state = "idle";          // idle | listening | thinking | speaking
  let conversation = false;    // hands-free mode on?
  let lastEventId = 0, wakeLock = null;

  function setState(s, text) {
    state = s; document.body.dataset.state = s;
    statusEl.textContent = text ?? ({ idle: "Tap to talk", standby: "Standby · say “Hey Jarvis” or tap", listening: "Listening…",
      thinking: "Thinking…", speaking: "Speaking — tap to interrupt" })[s];
    if (s !== "listening") orb.style.setProperty("--level", 0);
  }

  // Voice mode is the default; "Text" in the header shows the transcript and the typing box.
  const voicePref = safeGet("jarvis-voice-mode");
  document.body.classList.toggle("voice", voicePref !== "off");
  $("textToggle").onclick = () => {
    const voice = !document.body.classList.toggle("voice");
    safeSet("jarvis-voice-mode", voice ? "on" : "off");
    $("textToggle").classList.toggle("active", !voice);
    log.scrollTop = log.scrollHeight;
  };
  $("textToggle").classList.toggle("active", voicePref === "off");

  function add(kind, text, link) {
    if (link) {   // in voice mode a link still needs somewhere to be tapped
      const chip = $("linkChip"); chip.href = link; chip.textContent = (text || "Open") + " ↗"; chip.hidden = false;
      setTimeout(() => { chip.hidden = true; }, 60000);
    }
    if (kind === "sys" && document.body.classList.contains("voice") && /⚠|Using the server|Weak signal/.test(text)) {
      const t = $("toast"); if (t) { t.textContent = text; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 4000); }
    }
    const div = document.createElement("div");
    div.className = "msg " + kind; div.textContent = text;
    if (link) { const a = document.createElement("a"); a.href = link; a.textContent = " Open ↗"; div.appendChild(a); }
    log.appendChild(div); log.scrollTop = log.scrollHeight;
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "X-Jarvis-Token": token, ...(opts.headers || {}) } });
    if (res.status === 401) { document.body.classList.add("needs-token"); throw new Error("Bad token"); }
    if (!res.ok) {
      const detail = (await res.json().catch(() => ({}))).detail;
      throw new Error(detail ? `Jarvis error: ${detail}` : `Server error ${res.status}`);
    }
    return res.json();
  }

  // ---------- speaking ----------
  const SILENT = (() => {     // a tiny valid silent WAV, used to unlock audio on iOS
    const n = 800, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
    v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  })();
  function unlockAudio() {   // iOS only lets a page play sound after a tap
    player.src = SILENT; player.play().catch(() => {});
    if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  }

  // Sentence by sentence: the server makes each sentence's audio in parallel, so the first one is
  // ready almost at once; the next is downloaded while the current one plays.
  let speechRun = 0;
  // One sentence of the answer: {blob} to play, {text} to say with the phone's voice, or {end}.
  // The server waits for a sentence Claude is still writing, so this can be asked for early.
  function fetchPart(id, i) {
    return fetch(`/api/speech/${id}/${i}`, { headers: { "X-Jarvis-Token": token } })
      .then(async r => {
        if (r.ok) return { blob: await r.blob() };
        if (r.status === 410) return { end: true };
        const d = await r.json().catch(() => ({}));
        return d.text ? { text: d.text } : { end: true };
      }).catch(() => ({ end: true }));
  }
  try { if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: "Jarvis", artist: "Speaking" }); } catch {}
  function playBlob(blob) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(blob);
      player.src = url;
      let finished = false, guard = null;
      const finish = (v) => { if (finished) return; finished = true; clearInterval(guard);
        if (!player.ended) { try { player.pause(); } catch {} }
        player.onended = player.onerror = player.onpause = null; URL.revokeObjectURL(url); resolve(v); };
      player.onended = player.onerror = () => finish();
      player.onpause = () => { if (!player.ended) setTimeout(() => player.paused && finish(), 800); };  // interrupted
      let last = -1, still = 0;
      guard = setInterval(() => {   // stuck (no progress for 3 s): move on rather than wait forever
        if (player.currentTime === last) { if (++still >= 6) finish(); } else { still = 0; last = player.currentTime; }
      }, 500);
      player.play().catch(() => finish("failed"));
    });
  }
  let turnEndedAt = 0;
  function reportTiming() {   // measured on the phone: you stop talking -> Jarvis starts talking
    if (!turnEndedAt) return;
    diag("timing", { e2e: +((performance.now() - turnEndedAt) / 1000).toFixed(2) }); turnEndedAt = 0;
  }
  async function speakParts(data) {
    const run = ++speechRun;
    let next = fetchPart(data.speech_id, 0);
    for (let i = 0; ; i++) {
      const part = await next;
      if (run !== speechRun || part.end) return;            // interrupted, or that was all
      next = fetchPart(data.speech_id, i + 1);              // the next sentence loads while this plays
      if (i === 0 && part.blob) player.addEventListener("playing", reportTiming, { once: true });
      const failed = !part.blob || (await playBlob(part.blob)) === "failed";
      if (failed && part.text) await new Promise(r => speakLocally(part.text, r));
      if (run !== speechRun) return;
    }
  }


  function speak(data) {
    watchForBargeIn();
    return new Promise((resolve) => {
      if (data.speech_id) {
        speakParts(data).then(resolve);
      } else if (data.audio) {
        player.src = "data:audio/mpeg;base64," + data.audio;
        player.onended = player.onerror = resolve;
        setTimeout(resolve, 60000);
        player.play().catch(() => speakLocally(data.speech, resolve));
      } else speakLocally(data.speech || data.reply, resolve);
    });
  }
  function speakLocally(text, done) {
    if (!text || !("speechSynthesis" in window)) return done();
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    u.voice = voices.find(v => /Daniel|Arthur|en-GB/i.test(v.name + v.lang)) || null;
    let called = false;
    const finish = () => { if (!called) { called = true; done(); } };
    u.onend = u.onerror = finish;
    setTimeout(finish, 4000 + text.length * 90);   // iPhone sometimes never reports the end
    speechSynthesis.speak(u);
  }
  // ---------- interrupting Jarvis by talking (barge-in) ----------
  // While Jarvis speaks, the mic only measures loudness (nothing is recorded or sent). If you talk
  // over it, the voice stops and what you say becomes the next request. On the phone's own speaker
  // Jarvis's voice comes back into the mic, so by default this is on only with headphones/AirPods
  // (detected from the mic's name); tap the orb to interrupt anywhere. Type "voice interrupt on",
  // "off" or "auto" in the text box to change it.
  let bargedIn = false, bargeTimer = null;
  const HEADPHONES = /airpods|headphone|headset|bluetooth|beats|buds|earbud|earphone|wired/i;
  function bargeInMode() {
    const pref = safeGet("jarvis-bargein") || "auto";
    if (pref === "off" || useSR || !stream || !analyser) return "";
    const label = stream.getAudioTracks()[0]?.label || "";
    if (HEADPHONES.test(label)) return "headphones";
    return pref === "on" ? "speaker" : "";
  }
  function watchForBargeIn() {
    stopBargeWatch();
    const mode = conversation ? bargeInMode() : "";
    if (!mode) return;
    const buf = new Float32Array(analyser.fftSize), started = performance.now();
    let echo = 0, loudFor = 0;
    bargeTimer = setInterval(() => {
      analyser.getFloatTimeDomainData(buf);
      let sum = 0; for (const v of buf) sum += v * v;
      const rms = Math.sqrt(sum / buf.length), t = performance.now() - started;
      if (t < 600) { echo = Math.max(echo, rms); return; }   // learn how loud Jarvis's own voice comes back
      const threshold = mode === "headphones" ? Math.max(noiseFloor * 4, 0.03, echo * 2.5)
                                              : Math.max(0.08, echo * 3.5);
      loudFor = rms > threshold ? loudFor + 50 : 0;
      if (loudFor >= 300) {            // 0.3 s of clear talking over Jarvis: stop and listen
        stopBargeWatch(); bargedIn = true;
        diag("barge-in", { mode, level: +rms.toFixed(3), echo: +echo.toFixed(3) });
        stopSpeaking();
      }
    }, 50);
  }
  function stopBargeWatch() { clearInterval(bargeTimer); bargeTimer = null; }

  function stopSpeaking() {
    stopBargeWatch();
    speechRun++;
    player.pause(); player.onended && player.onended();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  }

  // ---------- listening (voice activity detection) ----------
  let stream = null, audioCtx = null, analyser = null, recorder = null, chunks = [];
  let resumeOnReturn = false, micFailures = 0, calibrated = false;
  let speechStart = 0, lastLoud = 0, recStart = 0, noiseFloor = 0.01, vadTimer = null;
  const mime = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(m => window.MediaRecorder?.isTypeSupported?.(m)) || "";

  async function openMic() {
    calibrated = false;

  // ---------- listening with the iPhone's own speech recognition (fast) ----------

          conversation = false; pauseMic();

      } else if (!text && now - started > 60000) {                // a minute of silence: restart quietly
        done = true; stopSR(); listen();
      } else if (!audioStarted && !text && now - started > 8000) {   // the mic never came on: try again
        done = true; stopSR(); diag("sr-no-audio", { fails: srCaptureFails + 1 });
        if (++srCaptureFails >= 3) useSR = false;                   // this time, record instead
        setTimeout(listen, 400);

    catch (e) { diag("sr-start-failed", { error: String(e?.name || e) }); stopSR(); conversation = false; setState("idle", "Tap to keep talking"); }
  }

  async function sendText(text) {
    userTalking = false;
    const norm = (x) => x.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
    if (norm(text) === norm(lastSent.text) && Date.now() - lastSent.at < 8000) {   // guard: identical, seconds apart
      diag("duplicate-ignored"); return listen();
    }
    lastSent = { text, at: Date.now() };
    recentSent = [...recentSent, lastSent].slice(-4);
    setState("thinking");
    try {
      const { id } = await api("/api/talk_text", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }) });
      savePending(id);
      let early = null;
      const data = await collect(id, (sid) => { setState("speaking"); early = speak({ speech_id: sid }); });
      if (!data || !data.heard) { if (early) await early; return listen(); }
      add("you", data.heard);

      if (data.standby || isStandby(data.heard)) return goStandby();

    listen();
  }

  // Speaking and listening never overlap. Whatever asks to listen (a finished turn, coming back to
  // the app, the watchdog), it waits until Jarvis's voice has actually stopped.
  function jarvisTalking() {
    const playing = !player.paused && !player.ended && player.currentTime > 0;

  }
  let listenWhenQuiet = null;

  async function listen() {

  // The answer is collected separately, so it survives the app being swiped away: the server keeps

  // ---------- standby: "I'm done" -> stop listening for requests; "Hey Jarvis" or a tap wakes it ----------

  const SIGNOFFS = ["Very good, sir. I'll be here.", "Standing by, sir.", "Right you are, sir. Just say the word.",

  function appLink(url) {
    try {
      const u = new URL(url);
      if (/(^|\.)waze\.com$/.test(u.hostname) && u.pathname.startsWith("/ul")) return "waze://" + u.search;
      if (/(^|\.)youtube\.com$/.test(u.hostname) && u.pathname === "/watch") return "youtube://watch" + u.search;
      if (u.hostname === "youtu.be") return "youtube://watch?v=" + u.pathname.slice(1);
      if (u.hostname === "maps.apple.com") return "maps://" + u.search;
      if (/(^|\.)spotify\.com$/.test(u.hostname)) return "spotify:" + u.pathname.slice(1).replace(/\//g, ":");
    } catch {}
    return url;
  }
  function openApp(url) {
    const target = appLink(url);
    diag("open", { url: target.slice(0, 80) });
    if (/^https?:/.test(target)) { const w = window.open(target, "_blank"); if (!w) location.href = target; }
    else location.href = target;   // an app: iPhone switches to it; this page stays as it is
  }
  const announcements = [];
  let announcing = false, userTalking = false;
  async function poll() {
    if (!token) return;
    try {
      const { events } = await api("/api/events?after=" + lastEventId + (conversation ? "&talking=1" : ""));
      for (const ev of events) {
        if (lastEventId === 0 && Date.now() / 1000 - ev.time > 60) { lastEventId = ev.id; continue; } // stale
        lastEventId = Math.max(lastEventId, ev.id);
        // iPhone often reloads the page after you switch apps; without this every recent "open"
        // ran again on each reload (the same app opening over and over).
        if (handledEvents.has(ev.id)) continue;
        handledEvents.add(ev.id); safeSet("jarvis-events", JSON.stringify([...handledEvents].slice(-50)));
        if (ev.type === "say") {
          add("jarvis", ev.text);
          announcements.push(ev.text);
        } else if (ev.type === "open") {
          add("jarvis", ev.text, ev.url);
          if (Date.now() / 1000 - ev.time < 30) openApp(ev.url);   // only fresh requests, once
        }
      }
    } catch {}
    drainAnnouncements();
  }
  setInterval(poll, 4000); poll();

  // Finished work, relayed session replies, reminders: said out loud in Jarvis's voice. Never over
  // you: if you're mid-sentence or Jarvis is answering, it waits for the end of that turn.
  async function drainAnnouncements() {
    if (!conversation) { announcements.length = 0; return; }   // not talking: it's in the transcript and on Telegram
    if (announcing || !announcements.length) return;
    if (state === "thinking" || state === "speaking" || userTalking) return;   // called again after the turn
    announcing = true;
    const resume = conversation && state === "listening";
    if (resume) pauseMic();
    try {
      while (announcements.length) {
        const text = announcements.shift();
        setState("speaking");
        let data = { speech: text };
        try { data = { ...(await api("/api/voice", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, announcement: true }) })), speech: text }; } catch {}
        await speak(data);
      }
    } finally {
      announcing = false;
      setState(conversation ? "listening" : "idle");
      if (resume || conversation) listen();
    }
  }
  // ---------- recovering from interruptions (switching apps, calls, Siri, the screen locking) ----------
  // iPhone freezes the page in the background: the mic, speech recognition and audio all stop, often
  // without telling us. So stop cleanly when leaving and start fresh when back, with no tap needed.
  function onLeave() {
    if (!conversation && state !== "standby") return;
    resumeOnReturn = true;
    diag("app-hidden", { state });
    // Don't cut Jarvis off: iPhone lets audio that's already playing carry on in the background,
    // so an answer finishes while you look at Maps. Only the listening stops.
    stopSR(); stopWake?.(); pauseMic();
    if (stream) stream.__stale = true;
  }
  async function onReturn() {
    if (document.visibilityState !== "visible") return;
    if (conversation && !wakeLock) { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
    if (!resumeOnReturn) return;
    resumeOnReturn = false;
    diag("app-visible", { state, conversation });
    await new Promise(r => setTimeout(r, 400));    // let iPhone hand the audio back
    if (audioCtx && audioCtx.state !== "running") await audioCtx.resume().catch(() => {});
    if (state === "standby") { listenForWake(); return; }
    if (state === "speaking" || jarvisTalking()) return;   // mid-reply: listening starts when it ends
    if (conversation && state !== "thinking") listen();   // a pending answer resumes on its own (collect)
  }
  document.addEventListener("visibilitychange", () => document.visibilityState === "hidden" ? onLeave() : onReturn());
  window.addEventListener("pagehide", onLeave);
  window.addEventListener("pageshow", onReturn);
  window.addEventListener("focus", onReturn);

  // Watchdog: in a conversation, something should always be listening, thinking or speaking.
  // If nothing is (a recognition session died silently), start listening again.
  let idleSince = 0;
  setInterval(() => {
    if (document.visibilityState !== "visible" || announcing) { idleSince = 0; return; }
    const listeningNow = !!(rec || vadTimer);
    if (jarvisTalking() || state === "speaking") { idleSince = 0; return; }
    const stuck = (conversation && state === "listening" && !listeningNow) ||
                  (conversation && state === "idle") ||
                  (state === "standby" && SR && !wakeRec && !resumeOnReturn);
    if (!stuck) { idleSince = 0; return; }
    if (!idleSince) { idleSince = Date.now(); return; }
    if (Date.now() - idleSince > 2500) {
      idleSince = 0; diag("watchdog-restart", { state });
      if (state === "standby") listenForWake(); else listen();
    }
  }, 1000);

  if (token) api("/api/status").then(s => add("sys", `Connected. At your service, ${s.user_name}.`))
    .catch(e => add("sys", "⚠ Can't reach Jarvis: " + e.message));
})();
</script>

<script>
/* ---------------- Dashboard ---------------- */
(() => {
  const $ = (id) => document.getElementById(id);
  const token = () => { try { return localStorage.getItem("jarvis-token"); } catch { return null; } };
  const talkView = $("talkView"), dashView = $("dashView");
  let timer = null;
  const jobEls = new Map();

  async function call(path, body, method) {
    const res = await fetch(path, {
      method: method || (body ? "POST" : "GET"),
      headers: { "X-Jarvis-Token": token() || "", ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `Error ${res.status}`);
    return res.json();
  }
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3500);
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text; return e; };
  const dur = (s) => s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;

  function show(which) {
    const dash = which === "dash";
    dashView.hidden = !dash; talkView.hidden = dash;
    $("tabDash").classList.toggle("active", dash); $("tabTalk").classList.toggle("active", !dash);
    $("reset").hidden = dash;
    clearInterval(timer);
    if (dash) { refresh(); timer = setInterval(refresh, 4000); }
    try { localStorage.setItem("jarvis-tab", which); } catch {}
  }
  $("tabTalk").onclick = () => show("talk");
  $("tabDash").onclick = () => show("dash");

  function renderJob(j) {
    let box = jobEls.get(j.id);
    if (!box) {
      box = el("div", "job");
      box.innerHTML = `<div class="head"><span class="pill"></span><span class="num"></span><span class="time"></span></div>
        <div class="task"></div><details class="act"><summary>Live activity</summary><pre class="mono"></pre></details>
        <div class="result"></div>
        <a class="primary preview" target="_blank" rel="noopener" hidden>Open preview ↗</a>
        <a class="small cloud" target="_blank" rel="noopener" hidden>Watch in Claude app ↗</a>
        <div class="inline follow"><input placeholder="Follow-up: e.g. make the buttons bigger"><button class="small" type="button">Send</button></div>
        <div class="row"><button class="small cancel" type="button">Cancel</button></div>`;
      const input = box.querySelector(".follow input");
      const send = async () => {
        const task = input.value.trim(); if (!task) return;
        try { const r = await call("/api/jobs", { task, follow_up_of: j.id }); input.value = "";
              toast(`Follow-up started as job ${r.id}.`); refresh(); } catch (e) { toast(e.message); }
      };
      box.querySelector(".follow button").onclick = send;
      input.onkeydown = (e) => { if (e.key === "Enter") send(); };
      box.querySelector(".cancel").onclick = async () => {
        try { toast((await call(`/api/jobs/${j.id}/cancel`, {})).result); refresh(); } catch (e) { toast(e.message); }
      };
      jobEls.set(j.id, box);
    }
    const pill = box.querySelector(".pill"); pill.className = `pill ${j.status}`; pill.textContent = j.status;
    box.querySelector(".num").textContent = `#${j.id}` + (j.continues ? ` (follows #${j.continues})` : "");
    box.querySelector(".time").textContent = j.seconds ? dur(j.seconds) : "";
    box.querySelector(".task").textContent = j.task;
    const active = j.status === "running" || j.status === "queued";
    const act = box.querySelector(".act");
    act.querySelector("pre").textContent = j.activity.length ? j.activity.join("\n") : "Waiting for the first step…";
    act.hidden = !j.activity.length && !active;
    if (!act.dataset.touched) act.open = j.status === "running";
    act.onclick = () => { act.dataset.touched = "1"; };
    box.querySelector(".result").textContent = j.result || "";
    const pv = box.querySelector(".preview");
    pv.hidden = !j.preview; if (j.preview) pv.href = j.preview;
    const cl = box.querySelector(".cloud");
    cl.hidden = !j.cloud_url; if (j.cloud_url) cl.href = j.cloud_url;
    box.querySelector(".follow").hidden = active || !["done", "failed"].includes(j.status);
    box.querySelector(".cancel").parentElement.hidden = !active;
    return box;
  }

  function setSeg(id, value) {
    document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle("on", b.dataset.v === value));
  }

  async function refresh() {
    if (!token()) return;
    let d;
    try { d = await call("/api/dashboard"); } catch (e) { $("statusText").textContent = "⚠ " + e.message; return; }
    // jobs
    const list = $("jobs");
    const ids = d.jobs.map(j => j.id);
    d.jobs.forEach((j, i) => { const box = renderJob(j); if (list.children[i] !== box) list.insertBefore(box, list.children[i] || null); });
    [...list.children].forEach(c => { if (![...jobEls].some(([id, b]) => b === c && ids.includes(id))) c.remove(); });
    const running = d.jobs.filter(j => j.status === "running").length;
    $("jobCount").textContent = d.jobs.length ? `${running} running · ${d.jobs.length} recent` : "";
    if (!d.jobs.length && !list.querySelector(".empty")) list.append(el("p", "empty", "No coding jobs yet. Describe one above, or just ask Jarvis."));
    if (d.jobs.length) list.querySelectorAll(".empty").forEach(e => e.remove());
    // controls
    setSeg("segMode", d.mode); setSeg("segWatch", d.claude_watch);
    $("wakeBtn").hidden = !d.night;
    // held
    const held = $("held"); held.replaceChildren();
    if (!d.held.length) held.append(el("li", "empty", d.night ? "Night mode is on; nothing held yet." : "Nothing waiting."));
    d.held.forEach(h => held.append(el("li", "", h)));
    // status, stats, memory
    $("statusText").textContent = d.status;
    $("statsText").textContent = d.stats;
    const mem = $("memory"); mem.replaceChildren();
    if (!d.memory.length) mem.append(el("li", "empty", "Nothing yet. Say \"remember that…\" to Jarvis."));
    d.memory.forEach(f => {
      const li = el("li"); li.append(el("span", "", f.fact));
      const x = el("button", "small", "✕"); x.title = "Forget";
      x.onclick = async () => { if (!confirm(`Forget: "${f.fact}"?`)) return;
        try { toast((await call("/api/control", { action: "forget", value: f.id })).result); refresh(); } catch (e) { toast(e.message); } };
      li.append(x); mem.append(li);
    });
  }

  // buttons
  $("jobStart").onclick = async () => {
    const task = $("jobTask").value.trim(); if (!task) return;
    try { const r = await call("/api/jobs", { task }); $("jobTask").value = ""; toast(`Job ${r.id} started.`); refresh(); }
    catch (e) { toast(e.message); }
  };
  document.querySelectorAll("#segMode button, #wakeBtn").forEach(b => b.onclick = async () => {
    try { toast((await call("/api/control", { action: "mode", value: b.dataset.v })).result); refresh(); } catch (e) { toast(e.message); }
  });
  document.querySelectorAll("#segWatch button").forEach(b => b.onclick = async () => {
    try { toast((await call("/api/control", { action: "watch", value: b.dataset.v })).result); refresh(); } catch (e) { toast(e.message); }
  });
  $("clearHeld").onclick = async () => {
    try { toast((await call("/api/control", { action: "clear_held" })).result); refresh(); } catch (e) { toast(e.message); }
  };
  $("updateBtn").onclick = async () => {
    toast("Checking…");
    try { toast((await call("/api/control", { action: "update" })).result.split("\n")[0]); } catch (e) { toast(e.message); }
  };

  let saved = null; try { saved = localStorage.getItem("jarvis-tab"); } catch {}
  show(saved === "dash" ? "dash" : "talk");
})();
</script>
</body>
</html>
